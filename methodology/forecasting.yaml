# Forecasting and scenario framework. Analyst assumptions are generated by
# eqr.model.assumptions from historical drivers + these rules, every one
# labelled ANALYST ASSUMPTION with its rationale. An inference model (when
# configured) may propose overrides; overrides must cite evidence ids and are
# bounded by the guardrails below.
version: 1

horizon:
  default_years: 7
  by_archetype: {mature_cash_generator: 7, high_growth: 10, cyclical: 7, bank: 5, insurer: 5, reit: 5, resource: 10}

drivers:
  revenue_growth:
    method: "fade from recent run-rate (weighted 3y CAGR 50%, last year 30%, 5y CAGR 20%) to terminal nominal growth over the horizon"
    guardrails: {min: -0.30, max: 0.60}
  operating_margin:
    method: "start at 3y average EBIT margin; fade 50% toward 5y average by final year unless evidence supports change"
    guardrails: {min: -0.50, max: 0.70}
  tax_rate:
    method: "3y median effective tax rate, bounded [statutory - 10pp, statutory + 10pp]; converge to the midpoint of that rate and statutory by the final year (prudence on minimum-tax regimes)"
    statutory_default: {US: 0.21, PK: 0.29, IN: 0.25, GB: 0.25, DEFAULT: 0.25}
  capex_pct_revenue: {method: "3y average capex/revenue"}
  dna_pct_revenue: {method: "3y average D&A/revenue; terminal D&A tends to capex x 0.9 (growth requires net investment)"}
  nwc_pct_revenue: {method: "3y average operating NWC/revenue (can be negative)"}
  sbc_pct_revenue: {method: "3y average SBC/revenue; treated as cash-equivalent expense (already in EBIT)"}
  share_count: {method: "net change = -(buyback yield assumption) + dilution; default: continue 3y average net share reduction rate, fading by 50%"}
  dividends_per_share_growth: {method: "track EPS growth, payout held at 3y average"}
  interest_on_cash: {method: "average cash x yield = risk-free short rate assumption (analyst assumption)"}
  terminal_ronic: {method: "RONIC = WACC + 50% x (min(3y avg ROIC, 40%) - WACC), floored at WACC. Excess returns persist only partially; growth beyond the horizon creates value only to that extent."}
  debt: {method: "hold gross debt flat at last reported level unless maturities/refinancing disclosed (analyst assumption)"}

scenarios:
  base: {label: "Base", revenue_growth_delta: 0.0, margin_delta: 0.0, wacc_delta: 0.0, terminal_g_delta: 0.0, probability: 0.50}
  bull: {label: "Bull", revenue_growth_delta: 0.025, margin_delta: 0.02, wacc_delta: -0.0025, terminal_g_delta: 0.0025, probability: 0.25}
  bear: {label: "Bear", revenue_growth_delta: -0.03, margin_delta: -0.03, wacc_delta: 0.005, terminal_g_delta: -0.005, probability: 0.25}
  stress:
    label: "Stress (not probability-weighted)"
    revenue_growth_delta: -0.08
    revenue_shock_years: 2
    margin_delta: -0.06
    wacc_delta: 0.01
    terminal_g_delta: -0.01
    probability: 0.0
  note: >
    Deltas are generic starting points. Sector playbooks override them with
    sector-specific shocks; LLM synthesis may propose company-specific
    scenario narratives but numeric deltas remain explicit and auditable.

sensitivity_expectations:
  # economically expected signs used by the sensitivity-direction gate
  value_vs_wacc: negative
  value_vs_terminal_growth: positive   # when RONIC > WACC
  value_vs_margin: positive
  value_vs_revenue_growth: positive    # when RONIC > WACC
