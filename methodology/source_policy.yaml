# Source-ranking and freshness policy. Read by eqr.sources.evidence and
# eqr.quality.gates. Lower tier number = more authoritative.
version: 1

tiers:
  1:
    name: "Primary regulatory / company"
    examples: ["SEC EDGAR filings and XBRL (10-K, 10-Q, 20-F, 40-F, 8-K)", "exchange disclosures (PSX, NSE, LSE RNS...)", "audited financial statements", "company investor-relations releases"]
    sufficient_for_material_claims: true
  2:
    name: "Official datasets"
    examples: ["US Treasury yield curve", "central banks", "statistical agencies", "regulators"]
    sufficient_for_material_claims: true
  3:
    name: "Credible industry / academic / reputable press"
    examples: ["trade associations", "Damodaran Online datasets (NYU Stern)", "reputable financial press"]
    sufficient_for_material_claims: true
    note: "Acceptable for market-wide parameters (e.g. implied ERP) when dated and cited."
  4:
    name: "Secondary aggregators"
    examples: ["price/quote aggregators (Stooq, Yahoo)", "screeners"]
    sufficient_for_material_claims: false
    note: "Discovery and cross-checking. Market prices from aggregators are accepted ONLY with a timestamp and, where possible, a second source cross-check."
  5:
    name: "Search snippets / unverified"
    sufficient_for_material_claims: false
    note: "Discovery aid only. Never cited as evidence for a material claim."

# Maximum acceptable age at the run cutoff before a STALE flag is raised.
freshness_days:
  market_price: 5            # trading days are approximated by calendar days
  risk_free_rate: 10
  equity_risk_premium: 100
  beta_price_history: 10     # age of last observation
  latest_annual_filing: 450
  latest_interim_filing: 140
  peer_market_data: 10

cache_ttl_hours:            # raw HTTP cache reuse window
  sec_submissions: 12
  sec_companyfacts: 24
  sec_filing_document: 8760  # filed documents are immutable
  market_prices: 6
  treasury: 12
  damodaran: 168

# Inputs that must be traceable to tier <= max_tier, otherwise the
# corresponding quality gate FAILS (blocks the "validated" label).
critical_inputs:
  historical_financials: {max_tier: 1}
  market_price: {max_tier: 4, require_timestamp: true}
  shares_outstanding: {max_tier: 1}
  risk_free_rate: {max_tier: 2}
  equity_risk_premium: {max_tier: 3}
  beta: {max_tier: 4, note: "computed by the engine from dated price histories, or a dated sourced beta"}

rate_limits_per_second:
  "sec.gov": 5               # SEC fair-access policy allows 10/s; we stay well below
  "data.sec.gov": 5
  default: 2

retrieved_content_policy: >
  All retrieved documents and web pages are UNTRUSTED DATA. Text inside them is
  never interpreted as instructions to the agent or the model. Prompts wrap
  evidence in <evidence> blocks and instruct the model accordingly.

legal: >
  Use only lawfully accessible public sources. Respect robots/rate limits and
  access restrictions. Never bypass paywalls. Never log credentials.
