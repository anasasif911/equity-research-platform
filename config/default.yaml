# Run configuration. Override per run with --config FILE or CLI flags.
# Secrets are read from environment variables only and never written to disk.
runs_dir: runs
inbox_dir: evidence_inbox
cache_dir: .cache/http

http:
  # SEC requires a descriptive User-Agent with contact details:
  # set EQR_SEC_USER_AGENT="Your Name your.email@example.com"
  user_agent_env: EQR_SEC_USER_AGENT
  default_user_agent: "eqr-research-platform/0.1 (set EQR_SEC_USER_AGENT)"
  timeout_s: 30
  retry: {max_attempts: 4, backoff_s: [2, 4, 8, 16]}

budget:
  max_fetches: 400
  max_minutes: 240
  max_llm_calls: 12
  max_llm_cost_usd: 15.0
  max_peers: 6

model:
  # Inference model for judgment-heavy tasks (synthesis, critique).
  #   anthropic      - Claude via API; needs ANTHROPIC_API_KEY
  #   agent_handoff  - writes request files; an external agent (e.g. Claude
  #                    Code) answers them; the run pauses and resumes
  #   none           - deterministic fallback; qualitative sections are
  #                    marked as not synthesised and gate G19 is NOT_RUN
  provider: auto            # auto = anthropic if key present, else agent_handoff
  anthropic_model: claude-opus-5-5
  max_tokens: 16000
  price_per_mtok_in: 4.0    # Opus 5.5 list price (2026-10); budget accounting only
  price_per_mtok_out: 20.0
  effort: high

defaults:
  horizon_months_view: "12-24"
  benchmark_us: "spy.us"
  currency_policy: reporting   # reporting | trading
